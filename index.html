<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P-PAC Workspace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;background:#f5f5f7;color:#1d1d1f}
    .page{height:100%;display:flex;flex-direction:column}
    .hidden{display:none!important}
    .wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
    
    #login-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
    .login-card{background:rgba(255,255,255,0.8);backdrop-filter:blur(20px);border:1px solid rgba(0,0,0,0.1);border-radius:18px;padding:2rem;width:350px}
    
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid #e5e5ea;flex-shrink:0}
    
    /* แก้ไขปัญหาการเลื่อน: ให้ .content เลื่อนได้ */
    .content{flex:1;overflow-y:auto;padding:20px}
    
    .nav-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:16px;margin-bottom:32px}
    .nav-card{background:#fff;padding:20px;border-radius:16px;cursor:pointer;border:1px solid #e5e5ea;position:relative}
    .nav-card:hover{border-color:#007aff}
    
    /* ปุ่มรวมไฟล์ สีฟ้า */
    .card-blue{background:#007aff!important;color:#fff!important}
    .card-blue .nav-label{color:#fff!important}
    .card-blue .nav-desc{color:#e0e0e0!important}
    
    .iframe-glass{flex:1;border-radius:12px;overflow:hidden;position:relative;background:#fff;border:1px solid #e5e5ea}
    .iframe-glass.fullscreen-mode{position:fixed;inset:0;z-index:9999;border-radius:0}
    .btn-exit-fs{display:none;position:absolute;top:10px;right:10px;background:#1d1d1f;color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;z-index:10000}
    .iframe-glass.fullscreen-mode .btn-exit-fs{display:block}
    
    iframe{width:100%;height:100%;border:none}
  </style>
</head>
<body>
<div class="page">
  <div class="wrap" id="main-screen">
    <div class="topbar">
      <strong>P-PAC Workspace</strong>
      <button onclick="logout()" style="border:none;background:none;cursor:pointer">ออกจากระบบ</button>
    </div>
    
    <div class="content" id="main-content">
      <!-- หน้า Dashboard -->
      <div id="tab-home">
        <h2>ระบบรายงาน</h2>
        <div class="nav-grid">
           <!-- ปุ่มรวมไฟล์สีฟ้า -->
           <div class="nav-card card-blue" onclick="openTool('รวมไฟล์', 'https://marketingppac-create.github.io/ppacpasathai/merger.html')">
              <div class="nav-label">รวมไฟล์ (PDF Merger)</div>
              <div class="nav-desc">จัดชุดรายงาน</div>
           </div>
        </div>
      </div>
      
      <!-- ตัวอย่าง Iframe จัดการงาน -->
      <div id="tab-tasks" class="hidden" style="height:100%">
        <div class="iframe-glass" id="tasks-fs">
          <button class="btn-exit-fs" onclick="toggleFS('tasks-fs')">ย่อหน้าจอ</button>
          <iframe src="https://script.google.com/macros/s/AKfycbxcE64x4vMA_Xmi2w5AYUAsoLM-oxBt_XTKfYSxQZZmeHDvG-nQN9-BG2ze0NF7AgJMcA/exec" sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function logout(){location.reload()}
function toggleFS(id){document.getElementById(id).classList.toggle('fullscreen-mode')}
function openTool(name, url){
    // Logic เปิดเครื่องมือ
    window.location.href = url; // หรือปรับเป็นการเปิดในหน้า Viewer
}
</script>
</body>
</html>
