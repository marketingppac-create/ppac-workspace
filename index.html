<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P-PAC Workspace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif}
    .bg{min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:2rem;position:relative;overflow-x:hidden}
    .bg::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(99,102,241,0.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(16,185,129,0.1) 0%,transparent 50%);pointer-events:none;z-index:0}
    .wrap{position:relative;z-index:1}
    .glass{background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:20px}
    .hidden{display:none!important}
    #login-screen{max-width:420px;margin:0 auto;padding-top:6rem}
    .logo-area{text-align:center;margin-bottom:2.5rem}
    .logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;box-shadow:0 0 30px rgba(99,102,241,0.4)}
    .logo-icon i{font-size:32px;color:#fff}
    .logo-title{font-size:26px;font-weight:700;color:#fff;letter-spacing:0.5px}
    .logo-sub{font-size:13px;color:rgba(255,255,255,0.45);margin-top:4px}
    .login-card{padding:2rem}
    .field-label{font-size:12px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:block}
    .field-input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 16px;color:#fff;font-size:15px;outline:none;transition:.2s}
    .field-input:focus{border-color:rgba(99,102,241,0.6);background:rgba(99,102,241,0.1)}
    .field-input::placeholder{color:rgba(255,255,255,0.25)}
    .field-wrap{margin-bottom:1.2rem}
    .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;box-shadow:0 4px 20px rgba(99,102,241,0.35)}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(99,102,241,0.5)}
    .err-msg{font-size:13px;color:#f87171;text-align:center;margin-top:12px;min-height:20px}
    #main-screen{max-width:900px;margin:0 auto}
    .top-bar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;margin-bottom:1.5rem}
    .top-title{font-size:20px;font-weight:700;color:#fff;cursor:default;user-select:none}
    .user-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:50px;padding:6px 14px 6px 8px}
    .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
    .user-name{font-size:13px;color:rgba(255,255,255,0.7)}
    .btn-logout{background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:12px;margin-left:4px;transition:.2s}
    .btn-logout:hover{color:#f87171}
    .section-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
    .nav-card{padding:2rem 1.5rem;text-align:center;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
    .nav-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.1)}
    .nav-icon{width:56px;height:56px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;font-size:26px}
    .icon-green{background:rgba(16,185,129,0.2);color:#10b981}
    .icon-purple{background:rgba(99,102,241,0.2);color:#818cf8}
    .nav-label{font-size:16px;font-weight:600;color:#fff;margin-bottom:4px}
    .nav-desc{font-size:12px;color:rgba(255,255,255,0.4)}
    .doc-section{padding:1.5rem}
    .doc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
    .doc-title-row{display:flex;align-items:center;gap:10px;user-select:none}
    .doc-title-icon{font-size:20px;color:#818cf8;cursor:pointer;transition:.2s}
    .doc-title-text{font-size:15px;font-weight:600;color:#fff}
    .doc-badge{font-size:11px;background:rgba(99,102,241,0.2);color:#818cf8;padding:2px 8px;border-radius:20px;border:1px solid rgba(99,102,241,0.3)}
    .doc-list{display:flex;flex-direction:column;gap:8px}
    .doc-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;transition:.2s}
    .doc-item:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.1)}
    .doc-item-icon{font-size:16px;color:#818cf8;flex-shrink:0}
    .doc-item-name{flex:1;font-size:13px;color:rgba(255,255,255,0.8)}
    .doc-item-link{font-size:12px;color:rgba(99,102,241,0.7);text-decoration:none;display:flex;align-items:center;gap:4px}
    .doc-item-link:hover{color:#818cf8}
    .doc-admin-btn{display:flex;gap:6px;margin-left:8px}
    .doc-admin-btn button{background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;transition:.2s;font-size:14px}
    .btn-del{color:#f87171}.btn-del:hover{background:rgba(248,113,113,0.15)}
    .btn-up{color:rgba(255,255,255,0.4)}.btn-up:hover{background:rgba(255,255,255,0.08);color:#fff}
    .btn-dn{color:rgba(255,255,255,0.4)}.btn-dn:hover{background:rgba(255,255,255,0.08);color:#fff}
    .add-doc-form{margin-top:1rem;display:flex;flex-direction:column;gap:8px}
    .add-doc-form input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;outline:none}
    .add-doc-form input:focus{border-color:rgba(99,102,241,0.5)}
    .add-doc-form input::placeholder{color:rgba(255,255,255,0.25)}
    .btn-add{padding:9px 16px;background:rgba(99,102,241,0.25);border:1px solid rgba(99,102,241,0.4);border-radius:8px;color:#818cf8;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
    .btn-add:hover{background:rgba(99,102,241,0.4)}
    .empty-doc{text-align:center;padding:2rem;color:rgba(255,255,255,0.25);font-size:13px}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
    .modal-box{background:#1e1e3a;border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:2rem;width:min(440px,90vw)}
    .modal-title{font-size:17px;font-weight:700;color:#fff;margin-bottom:1.5rem;display:flex;align-items:center;gap:8px}
    .modal-title i{color:#818cf8}
    .modal-row{margin-bottom:1rem}
    .modal-row label{font-size:12px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}
    .modal-row input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 14px;color:#fff;font-size:14px;outline:none}
    .modal-row input:focus{border-color:rgba(99,102,241,0.5)}
    .modal-btns{display:flex;gap:8px;margin-top:1.5rem}
    .btn-confirm{flex:1;padding:11px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
    .btn-cancel{flex:1;padding:11px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:rgba(255,255,255,0.6);font-size:14px;cursor:pointer}
    .log-table{width:100%;border-collapse:collapse;font-size:12px}
    .log-table th{text-align:left;color:rgba(255,255,255,0.4);font-weight:500;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,0.07)}
    .log-table td{padding:7px 10px;color:rgba(255,255,255,0.7);border-bottom:1px solid rgba(255,255,255,0.04)}
    .toast{position:fixed;bottom:2rem;right:2rem;background:rgba(30,30,58,0.97);border:1px solid rgba(99,102,241,0.4);border-radius:12px;padding:12px 20px;color:#fff;font-size:13px;display:flex;align-items:center;gap:8px;z-index:2000;transform:translateY(80px);opacity:0;transition:.3s;pointer-events:none}
    .toast.show{transform:translateY(0);opacity:1}
    .toast i{color:#10b981;font-size:16px}
    .tabs{display:flex;gap:6px;margin-bottom:1.5rem;padding:0.5rem}
    .tab-btn{padding:8px 18px;border-radius:50px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer;transition:.2s}
    .tab-btn.active{background:rgba(99,102,241,0.25);border-color:rgba(99,102,241,0.5);color:#818cf8}
    .log-section{padding:1.5rem}
    @media(max-width:560px){.section-grid{grid-template-columns:1fr}.bg{padding:1rem}}
  </style>
</head>
<body>
<div class="bg" id="app">
  <div class="wrap">

    <div id="login-screen">
      <div class="logo-area">
        <div class="logo-icon"><i class="ti ti-layout-dashboard"></i></div>
        <div class="logo-title">P-PAC Workspace</div>
        <div class="logo-sub">กรุณาเข้าสู่ระบบเพื่อใช้งาน</div>
      </div>
      <div class="glass login-card">
        <div class="field-wrap">
          <label class="field-label">ชื่อผู้ใช้</label>
          <input class="field-input" id="inp-user" placeholder="username" autocomplete="off">
        </div>
        <div class="field-wrap">
          <label class="field-label">รหัสผ่าน</label>
          <input class="field-input" id="inp-pass" type="password" placeholder="password">
        </div>
        <button class="btn-primary" id="btn-login">เข้าสู่ระบบ</button>
        <div class="err-msg" id="login-err"></div>
      </div>
    </div>

    <div id="main-screen" class="hidden">
      <div class="glass top-bar">
        <div class="top-title" id="workspace-title">P-PAC Workspace</div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="user-pill">
            <div class="avatar" id="user-avatar">U</div>
            <span class="user-name" id="user-display">-</span>
            <button class="btn-logout" id="btn-logout"><i class="ti ti-logout" style="font-size:14px"></i></button>
          </div>
        </div>
      </div>

      <div class="tabs glass">
        <button class="tab-btn active" onclick="switchTab('home',this)"><i class="ti ti-home" style="font-size:14px;margin-right:5px"></i>หน้าหลัก</button>
        <button class="tab-btn" onclick="switchTab('docs',this)"><i class="ti ti-files" style="font-size:14px;margin-right:5px"></i>เอกสารองค์กร</button>
        <button class="tab-btn" id="tab-log-btn" onclick="switchTab('log',this)" style="display:none"><i class="ti ti-list" style="font-size:14px;margin-right:5px"></i>ประวัติเข้าใช้</button>
      </div>

      <div id="tab-home">
        <div class="section-grid">
          <div class="glass nav-card" onclick="goCreate()">
            <div class="nav-icon icon-green"><i class="ti ti-file-text"></i></div>
            <div class="nav-label">สร้างรายงานภาษาไทย</div>
            <div class="nav-desc">Generate Thai Reports</div>
          </div>
          <div class="glass nav-card" onclick="goManage()">
            <div class="nav-icon icon-purple"><i class="ti ti-layout-kanban"></i></div>
            <div class="nav-label">จัดการงาน</div>
            <div class="nav-desc">Task Management</div>
          </div>
        </div>
      </div>

      <div id="tab-docs" class="hidden">
        <div class="glass doc-section">
          <div class="doc-header">
            <div class="doc-title-row">
              <i class="ti ti-folder doc-title-icon" id="doc-mgr-icon"></i>
              <span class="doc-title-text">เอกสารสื่อสารองค์กร</span>
              <span class="doc-badge" id="doc-count">0 รายการ</span>
            </div>
          </div>
          <div class="doc-list" id="doc-list"></div>
          <div id="add-doc-panel" class="hidden">
            <div class="add-doc-form">
              <input id="new-doc-name" placeholder="ชื่อเอกสาร...">
              <input id="new-doc-url" placeholder="https://...">
              <button class="btn-add" onclick="addDoc()"><i class="ti ti-plus" style="font-size:14px;margin-right:4px"></i>เพิ่มเอกสาร</button>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-log" class="hidden">
        <div class="glass log-section">
          <div style="font-size:15px;font-weight:600;color:#fff;margin-bottom:1rem;display:flex;align-items:center;gap:8px">
            <i class="ti ti-list-check" style="color:#818cf8"></i> ประวัติการเข้าใช้งาน
          </div>
          <div style="overflow-x:auto">
            <table class="log-table">
              <thead><tr><th>#</th><th>ผู้ใช้</th><th>วันที่/เวลา</th><th>หมายเหตุ</th></tr></thead>
              <tbody id="log-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div id="modal-adduser" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-title"><i class="ti ti-user-plus"></i>จัดการ Users (Admin)</div>
        <div style="margin-bottom:1rem">
          <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:8px">รายชื่อ Users ปัจจุบัน</div>
          <div id="user-list-admin" style="display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto"></div>
        </div>
        <div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:1rem;margin-top:0.5rem">
          <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:8px">เพิ่ม User ใหม่</div>
          <div class="modal-row"><label>Username</label><input id="new-uname" placeholder="username"></div>
          <div class="modal-row"><label>Password</label><input id="new-upass" type="password" placeholder="password"></div>
          <div class="modal-btns">
            <button class="btn-confirm" onclick="createUser()"><i class="ti ti-plus" style="font-size:14px;margin-right:4px"></i>สร้าง User</button>
            <button class="btn-cancel" onclick="closeModal('modal-adduser')">ปิด</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"><i class="ti ti-circle-check"></i><span id="toast-msg"></span></div>

  </div>
</div>

<script>
const ADMIN='admin';
let state={
  users:JSON.parse(localStorage.getItem('ppac_users')||'{"admin":{"pass":"ppac2024","role":"admin"}}'),
  docs:JSON.parse(localStorage.getItem('ppac_docs')||'[]'),
  logs:JSON.parse(localStorage.getItem('ppac_logs')||'[]'),
  curUser:null,curRole:null
};
let titleClicks=0,titleTimer=null,docIconClicks=0,docIconTimer=null,isDocAdmin=false;
function save(){
  localStorage.setItem('ppac_users',JSON.stringify(state.users));
  localStorage.setItem('ppac_docs',JSON.stringify(state.docs));
  localStorage.setItem('ppac_logs',JSON.stringify(state.logs));
}
function showToast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function login(){
  const u=document.getElementById('inp-user').value.trim();
  const p=document.getElementById('inp-pass').value;
  const err=document.getElementById('login-err');
  if(!state.users[u]||state.users[u].pass!==p){err.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return}
  state.curUser=u;state.curRole=state.users[u].role;
  const now=new Date();
  state.logs.unshift({user:u,time:now.toLocaleString('th-TH'),note:'เข้าสู่ระบบ'});
  if(state.logs.length>200)state.logs=state.logs.slice(0,200);
  save();
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.remove('hidden');
  document.getElementById('user-display').textContent=u;
  document.getElementById('user-avatar').textContent=u[0].toUpperCase();
  if(state.curRole==='admin')document.getElementById('tab-log-btn').style.display='';
  err.textContent='';
  renderDocs();renderLog();
}
function logout(){
  state.curUser=null;state.curRole=null;isDocAdmin=false;titleClicks=0;docIconClicks=0;
  document.getElementById('main-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('inp-user').value='';document.getElementById('inp-pass').value='';
  document.getElementById('tab-log-btn').style.display='none';
  switchTab('home',document.querySelector('.tab-btn'));
}
document.getElementById('btn-login').onclick=login;
document.getElementById('btn-logout').onclick=logout;
document.getElementById('inp-pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
document.getElementById('workspace-title').onclick=function(){
  titleClicks++;
  if(titleTimer)clearTimeout(titleTimer);
  if(titleClicks>=5){titleClicks=0;if(state.curRole==='admin')openUserModal()}
  else titleTimer=setTimeout(()=>titleClicks=0,2000);
};
document.getElementById('doc-mgr-icon').onclick=function(){
  if(state.curRole!=='admin')return;
  docIconClicks++;
  if(docIconTimer)clearTimeout(docIconTimer);
  if(docIconClicks>=5){
    docIconClicks=0;isDocAdmin=!isDocAdmin;
    document.getElementById('add-doc-panel').classList.toggle('hidden',!isDocAdmin);
    showToast(isDocAdmin?'โหมดแก้ไขเอกสาร: เปิด':'โหมดแก้ไขเอกสาร: ปิด');
    renderDocs();
  }else docIconTimer=setTimeout(()=>docIconClicks=0,2000);
};
function switchTab(name,btn){
  ['home','docs','log'].forEach(t=>document.getElementById('tab-'+t).classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.remove('hidden');
  if(btn)btn.classList.add('active');
  if(name==='docs')renderDocs();
  if(name==='log')renderLog();
}
function goCreate(){
  state.logs.unshift({user:state.curUser,time:new Date().toLocaleString('th-TH'),note:'คลิก: สร้างรายงานภาษาไทย'});
  save();window.open('https://marketingppac-create.github.io/ppacpasathai/genarate.html','_blank');
}
function goManage(){
  state.logs.unshift({user:state.curUser,time:new Date().toLocaleString('th-TH'),note:'คลิก: จัดการงาน'});
  save();window.open('https://script.google.com/macros/s/AKfycbxcE64x4vMA_Xmi2w5AYUAsoLM-oxBt_XTKfYSxQZZmeHDvG-nQN9-BG2ze0NF7AgJMcA/exec','_blank');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function renderDocs(){
  const list=document.getElementById('doc-list');
  document.getElementById('doc-count').textContent=state.docs.length+' รายการ';
  if(state.docs.length===0){list.innerHTML='<div class="empty-doc"><i class="ti ti-file-off" style="font-size:28px;display:block;margin-bottom:6px"></i>ยังไม่มีเอกสาร</div>';return}
  list.innerHTML=state.docs.map((d,i)=>`
    <div class="doc-item">
      <i class="ti ti-file-description doc-item-icon"></i>
      <span class="doc-item-name">${esc(d.name)}</span>
      <a class="doc-item-link" href="${esc(d.url)}" target="_blank"><i class="ti ti-external-link" style="font-size:13px"></i>เปิด</a>
      ${isDocAdmin&&state.curRole==='admin'?`<div class="doc-admin-btn">
        ${i>0?`<button class="btn-up" onclick="moveDoc(${i},-1)"><i class="ti ti-arrow-up"></i></button>`:''}
        ${i<state.docs.length-1?`<button class="btn-dn" onclick="moveDoc(${i},1)"><i class="ti ti-arrow-down"></i></button>`:''}
        <button class="btn-del" onclick="delDoc(${i})"><i class="ti ti-trash"></i></button>
      </div>`:''}
    </div>`).join('');
}
function addDoc(){
  const name=document.getElementById('new-doc-name').value.trim();
  const url=document.getElementById('new-doc-url').value.trim();
  if(!name||!url){showToast('กรุณากรอกชื่อและลิงก์');return}
  state.docs.push({name,url});save();renderDocs();
  document.getElementById('new-doc-name').value='';document.getElementById('new-doc-url').value='';
  showToast('เพิ่มเอกสารแล้ว');
}
function delDoc(i){state.docs.splice(i,1);save();renderDocs();showToast('ลบเอกสารแล้ว')}
function moveDoc(i,dir){
  const j=i+dir;if(j<0||j>=state.docs.length)return;
  [state.docs[i],state.docs[j]]=[state.docs[j],state.docs[i]];save();renderDocs();
}
function renderLog(){
  const tb=document.getElementById('log-body');
  if(state.logs.length===0){tb.innerHTML='<tr><td colspan="4" style="text-align:center;color:rgba(255,255,255,0.3);padding:1rem">ยังไม่มีประวัติ</td></tr>';return}
  tb.innerHTML=state.logs.slice(0,100).map((l,i)=>`<tr><td style="color:rgba(255,255,255,0.3)">${i+1}</td><td>${esc(l.user)}</td><td>${esc(l.time)}</td><td>${esc(l.note||'-')}</td></tr>`).join('');
}
function openUserModal(){renderUserList();document.getElementById('modal-adduser').classList.remove('hidden')}
function closeModal(id){document.getElementById(id).classList.add('hidden')}
function renderUserList(){
  const ul=document.getElementById('user-list-admin');
  ul.innerHTML=Object.keys(state.users).map(u=>`
    <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.04);border-radius:8px;padding:7px 10px;">
      <div style="display:flex;align-items:center;gap:8px">
        <i class="ti ti-user-circle" style="font-size:16px;color:#818cf8"></i>
        <span style="font-size:13px;color:rgba(255,255,255,0.8)">${esc(u)}</span>
        ${state.users[u].role==='admin'?'<span style="font-size:10px;background:rgba(99,102,241,0.2);color:#818cf8;padding:1px 7px;border-radius:20px">admin</span>':''}
      </div>
      ${u!==ADMIN?`<button onclick="deleteUser('${u}')" style="background:none;border:none;cursor:pointer;color:#f87171;font-size:14px"><i class="ti ti-trash"></i></button>`:''}
    </div>`).join('');
}
function createUser(){
  const u=document.getElementById('new-uname').value.trim();
  const p=document.getElementById('new-upass').value;
  if(!u||!p){showToast('กรุณากรอกข้อมูล');return}
  if(state.users[u]){showToast('Username นี้มีอยู่แล้ว');return}
  state.users[u]={pass:p,role:'user'};save();renderUserList();
  document.getElementById('new-uname').value='';document.getElementById('new-upass').value='';
  showToast('สร้าง User เรียบร้อย');
}
function deleteUser(u){delete state.users[u];save();renderUserList();showToast('ลบ User เรียบร้อย')}
document.getElementById('modal-adduser').onclick=function(e){if(e.target===this)closeModal('modal-adduser')}
</script>
</body>
</html>
